version: '3.8'
services:
  mysql:
    image: mysql:8.4
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: AgroMarketSecureRootPassword2026!
      MYSQL_DATABASE: agromarket_db
      MYSQL_USER: mysql
      MYSQL_PASSWORD: AgroMarketUserPassword2026!
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./agroMarket
      dockerfile: Dockerfile
    container_name: app-backend
    ports:
      - "7860:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/agromarket_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      - SPRING_DATASOURCE_USERNAME=mysql
      - SPRING_DATASOURCE_PASSWORD=AgroMarketUserPassword2026!
      - JWT_SECRET=AgroMarket2026SuperSecretKeyParaJWTProduccionMinLength256bits!!
      - APP_FRONTEND_URL=https://www.agro-market.app
      - CORS_ALLOWED_ORIGINS=https://www.agro-market.app,https://agro-market.app
      - APP_ENV=production
      - SERVER_PORT=8080
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
