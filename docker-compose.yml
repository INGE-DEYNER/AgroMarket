services:
  agromarket-mysql:
    image: mysql:8.0
    container_name: agromarket-mysql
    restart: unless-stopped
    env_file:
      - ./agroMarket/.env
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: agromarket
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - agromarket-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  agromarket-mongo:
    image: mongo:7
    container_name: agromarket-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - agromarket-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./agroMarket
      dockerfile: Dockerfile
    container_name: agromarket-backend
    env_file:
      - ./agroMarket/.env
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://agromarket-mysql:3306/agromarket?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      SPRING_DATA_MONGODB_URI: mongodb://agromarket-mongo:27017/agromarket
    depends_on:
      agromarket-mysql:
        condition: service_healthy
      agromarket-mongo:
        condition: service_healthy
    volumes:
      - ./agroMarket/uploads:/app/uploads
    networks:
      - agromarket-net

networks:
  agromarket-net:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
