services:
  mysql:
    image: mysql:8.4
    container_name: agromarket-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: agromarket_db
      MYSQL_USER: agromarket_user
      MYSQL_PASSWORD: agromarket_pass
      TZ: America/Bogota
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpass --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
