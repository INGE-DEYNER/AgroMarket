services:
  mysql:
    image: mysql:8.4
    container_name: agromarket-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: agromarket_db
      MYSQL_USER: agromarket_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: America/Bogota
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./agroMarket
      dockerfile: Dockerfile
    container_name: agromarket-app
    restart: unless-stopped
    ports:
      - "8091:8080"
    environment:
      # Database
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/agromarket_db
      - SPRING_DATASOURCE_USERNAME=agromarket_user
      - SPRING_DATASOURCE_PASSWORD=agromarket_pass
      - DB_HIKARI_MAX_POOL=20
      - DB_HIKARI_MIN_IDLE=5

      # JWT (use .env or fallback secure default)
      - JWT_SECRET=${JWT_SECRET:-8f3e9b2a-5d4c-4a1f-9d2b-7c6e2a1f9b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2}

      # OAuth2 Google (set these via .env or environment)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://agromarket.dev:8090}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://agromarket.dev:8090,https://localhost:8090}

      # Mail
      - MAIL_HOST=${MAIL_HOST:-localhost}
      - MAIL_PORT=${MAIL_PORT:-1025}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_SMTP_AUTH=${MAIL_SMTP_AUTH:-false}
      - MAIL_STARTTLS=${MAIL_STARTTLS:-false}

      # Uploads
      - UPLOADS_PATH=/home/appuser/uploads

      # Cache & Performance
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-30}

      # Environment
      - APP_ENV=${APP_ENV:-development}
    volumes:
      - ./agroMarket/uploads:/home/appuser/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agromarket-frontend
    restart: unless-stopped
    ports:
      - "8090:443"
    volumes:
      - ./frontend/certs:/etc/nginx/certs:ro
    depends_on:
      - app

volumes:
  mysql_data:
