apiVersion: batch/v1
kind: CronJob
metadata:
  name: agromarket-mysql-backup
spec:
  schedule: "0 2 * * *" # daily at 02:00
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              image: mysql:8.4
              command: ["/bin/sh","-c"]
              args: ['mysqldump -h $DB_HOST -P $DB_PORT -u$DB_USERNAME -p$DB_PASSWORD $DB_NAME | gzip > /backups/$DB_NAME-$(date +%Y%m%dT%H%M%S).sql.gz']
              env:
                - name: DB_HOST
                  value: mysql
                - name: DB_PORT
                  value: "3306"
                - name: DB_NAME
                  value: agromarket_db
                - name: DB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: agromarket-secrets
                      key: db_username
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: agromarket-secrets
                      key: db_password
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
          restartPolicy: OnFailure
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: agromarket-backup-pvc
