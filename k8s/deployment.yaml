apiVersion: apps/v1
kind: Deployment
metadata:
  name: agromarket
  labels:
    app: agromarket
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agromarket
  template:
    metadata:
      labels:
        app: agromarket
    spec:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
      containers:
        - name: agromarket
          image: ghcr.io/OWNER/agromarket:latest # replace OWNER or use templating
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: agromarket-secrets
                  key: db_username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agromarket-secrets
                  key: db_password
            - name: JDBC_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agromarket-secrets
                  key: jdbc_url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agromarket-secrets
                  key: jwt_secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
