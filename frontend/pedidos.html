<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedidos — AgroMarket</title>
    <meta name="description" content="Gestión de pedidos en AgroMarket." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <a class="navbar-brand" href="dashboard-comprador.html">
        <span class="logo-icon">🌿</span><span>AgroMarket</span>
      </a>
      <div class="navbar-links" id="navLinks">
        <a href="dashboard-comprador.html">Mi Panel</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="pedidos.html" class="active">Pedidos</a>
        <a href="mensajeria.html">Mensajes</a>
        <a href="envios.html">Envíos</a>
      </div>
      <div class="navbar-right" id="navActions">
        <div class="avatar avatar-blue">--</div>
        <a
          href="#"
          onclick="
            Auth.logout();
            return false;
          "
          class="btn btn-secondary btn-sm"
          >Cerrar sesión</a
        >
      </div>
    </nav>

    <main style="padding: 28px 32px; max-width: 1280px; margin: 0 auto">
      <!-- SUCCESS BANNER -->
      <div
        id="successBanner"
        style="
          display: none;
          background: var(--green-bg);
          border: 1px solid #1f4d2a;
          border-radius: var(--radius);
          padding: 14px 18px;
          margin-bottom: 20px;
          color: var(--green-light);
          font-weight: 600;
          display: none;
          align-items: center;
          gap: 10px;
        "
      >
        ✅ ¡Pedido realizado con éxito! Ya está siendo procesado por el
        productor.
      </div>

      <div class="section-header">
        <span class="section-title">🧾 Mis Pedidos</span>
        <div
          style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap"
        >
          <select
            class="form-select"
            style="width: 170px"
            id="filtroEstado"
            onchange="filtrar()"
          >
            <option value="">Todos los estados</option>
            <option>Pendiente</option>
            <option>Enviado</option>
            <option>Entregado</option>
            <option>Cancelado</option>
          </select>
          <a href="catalogo.html" class="btn btn-primary">+ Nuevo pedido</a>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Producto</th>
              <th>Productor</th>
              <th>Cantidad</th>
              <th>Total</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tbPedidos"></tbody>
        </table>
      </div>
    </main>

    <!-- MODAL FACTURA -->
    <div class="modal-overlay" id="modalFactura">
      <div class="modal" style="max-width: 480px">
        <div class="modal-header">
          <span class="modal-title">Factura de Pedido</span>
          <button class="modal-close" onclick="closeFactura()">✕</button>
        </div>
        <div id="facturaBody"></div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeFactura()">
            Cerrar
          </button>
          <button
            class="btn btn-primary"
            onclick="
              alert('Factura enviada al correo registrado exitosamente.')
            "
          >
            📧 Enviar por correo
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="js/navbar.js"></script>
    <script type="module" src="js/pedidos.js"></script>
  </body>
</html>
