<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mensajería — AgroMarket</title>
    <meta
      name="description"
      content="Mensajería interna de AgroMarket ASAFRUT."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/mensajeria.css" />
  </head>
  <body>
    <div class="page-wrap">
      <!-- NAVBAR -->
      <nav class="navbar">
        <a class="navbar-brand" href="dashboard-comprador.html">
          <span class="logo-icon">🌿</span><span>AgroMarket</span>
        </a>
        <div class="navbar-links" id="navLinks">
          <a href="dashboard-comprador.html">Mi Panel</a>
          <a href="catalogo.html">Catálogo</a>
          <a href="pedidos.html">Pedidos</a>
          <a href="mensajeria.html" class="active">Mensajes</a>
          <a href="envios.html">Envíos</a>
        </div>
        <div class="navbar-right" id="navActions">
          <div class="avatar avatar-blue">MT</div>
          <a href="login.html" class="btn btn-secondary btn-sm">Salir</a>
        </div>
      </nav>

      <!-- CHAT LAYOUT -->
      <div class="chat-layout">
        <!-- CONTACTS -->
        <div class="chat-contacts" id="contactList"></div>

        <!-- WINDOW -->
        <div class="chat-window">
          <div class="chat-header" id="chatHeader">
            <div class="avatar avatar-green" id="chatAvatar">--</div>
            <div>
              <div class="chat-name" id="chatName">
                Selecciona una conversación
              </div>
              <div
                style="font-size: 0.75rem; color: var(--text-muted)"
                id="chatRole"
              ></div>
            </div>
            <div style="margin-left: auto">
              <span
                class="badge badge-green"
                id="onlineBadge"
                style="display: none"
                >● En línea</span
              >
            </div>
          </div>

          <div class="chat-messages" id="chatMessages">
            <div class="empty-state" style="margin: auto">
              <div class="empty-icon">💬</div>
              <div>Selecciona un contacto para iniciar la conversación.</div>
            </div>
          </div>

          <div class="chat-input-bar">
            <input
              class="chat-input"
              id="msgInput"
              placeholder="Escribe un mensaje..."
              onkeydown="handleKey(event)"
              disabled
            />
            <button
              class="btn btn-primary"
              id="sendBtn"
              onclick="sendMessage()"
              disabled
            >
              <svg width="16" height="16" fill="none" viewBox="0 0 24 24">
                <path
                  d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>
      <!-- /chat-layout -->
    </div>
    <!-- /page-wrap -->

    <script type="module" src="js/navbar.js"></script>
    <script type="module" src="js/mensajeria.js"></script>
  </body>
</html>
