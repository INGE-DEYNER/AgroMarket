<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Envíos — AgroMarket</title>
    <meta name="description" content="Seguimiento de envíos en AgroMarket." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/envios.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <a class="navbar-brand" href="dashboard-comprador.html">
        <span class="logo-icon">🌿</span><span>AgroMarket</span>
      </a>
      <div class="navbar-links" id="navLinks">
        <a href="dashboard-comprador.html">Mi Panel</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="pedidos.html">Pedidos</a>
        <a href="mensajeria.html">Mensajes</a>
        <a href="envios.html" class="active">Envíos</a>
      </div>
      <div class="navbar-right" id="navActions">
        <div class="avatar avatar-blue">--</div>
        <a
          href="#"
          onclick="
            Auth.logout();
            return false;
          "
          class="btn btn-secondary btn-sm"
          >Cerrar sesión</a
        >
      </div>
    </nav>

    <main style="padding: 28px 32px; max-width: 1100px; margin: 0 auto">
      <div class="section-header" style="margin-bottom: 24px">
        <span class="section-title">🚚 Seguimiento de Envíos</span>
      </div>

      <!-- ACTIVE SHIPMENTS -->
      <div id="shipmentsContainer"></div>

      <!-- HISTORY TABLE -->
      <div style="margin-top: 32px">
        <h3
          style="
            font-family: var(--font-title);
            font-size: 1.05rem;
            margin-bottom: 16px;
          "
        >
          📋 Historial de todos los envíos
        </h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID Envío</th>
                <th>Producto</th>
                <th>Origen → Destino</th>
                <th>Transportista</th>
                <th>Estado</th>
                <th>Fecha</th>
              </tr>
            </thead>
            <tbody id="tbHistorial"></tbody>
          </table>
        </div>
      </div>
    </main>

    <script type="module" src="js/site-info.js"></script>
    <script type="module" src="js/navbar.js"></script>
    <script type="module" src="js/envios.js"></script>
  </body>
</html>
