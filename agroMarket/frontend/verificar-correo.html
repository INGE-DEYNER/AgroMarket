<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Verificar correo - AgroMarket</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/verificar-correo.css" />
  </head>
  <body>
    <main class="container">
      <h1>Verificar correo</h1>
      <p id="sent-to"></p>
      <form id="verify-form">
        <div id="code-inputs">
          <input
            maxlength="1"
            inputmode="numeric"
            pattern="[0-9]*"
            class="digit"
          />
          <input
            maxlength="1"
            inputmode="numeric"
            pattern="[0-9]*"
            class="digit"
          />
          <input
            maxlength="1"
            inputmode="numeric"
            pattern="[0-9]*"
            class="digit"
          />
          <input
            maxlength="1"
            inputmode="numeric"
            pattern="[0-9]*"
            class="digit"
          />
          <input
            maxlength="1"
            inputmode="numeric"
            pattern="[0-9]*"
            class="digit"
          />
          <input
            maxlength="1"
            inputmode="numeric"
            pattern="[0-9]*"
            class="digit"
          />
        </div>
        <button id="verify" type="submit">Verificar</button>
      </form>
      <div id="timer">15:00</div>
      <button id="resend" disabled>Reenviar código</button>
      <div id="status" class="hidden"></div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/verificar-correo.js"></script>
  <script src="js/site-info.js"></script>
  </body>
</html>
