<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Restablecer contraseña - AgroMarket</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/restablecer-contrasena.css" />
  </head>
  <body>
    <main class="container">
      <h1>Restablecer contraseña</h1>
      <form id="restablecer-form">
        <label for="nueva">Nueva contraseña</label>
        <input id="nueva" name="nueva" type="password" required minlength="8" />

        <label for="confirm">Confirmar contraseña</label>
        <input id="confirm" name="confirm" type="password" required />

        <div id="checks">
          <div id="c-length">Mínimo 8 caracteres</div>
          <div id="c-upper">Al menos una mayúscula</div>
          <div id="c-number">Al menos un número</div>
          <div id="c-special">Al menos un carácter especial</div>
        </div>

        <button id="submit" type="submit">Restablecer contraseña</button>
      </form>
      <div id="status" class="hidden"></div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/restablecer-contrasena.js"></script>
  </body>
</html>
