<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Recuperar contraseña - AgroMarket</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/recuperar-contrasena.css" />
  </head>
  <body>
    <main class="container">
      <h1>Recuperar contraseña</h1>
      <form id="recuperar-form">
        <label for="correo">Correo electrónico</label>
        <input
          id="correo"
          name="correo"
          type="email"
          required
          placeholder="tu@correo.com"
        />
        <button id="submit" type="submit">Enviar instrucciones</button>
      </form>

      <div id="status" class="hidden"></div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/recuperar-contrasena.js"></script>
  <script src="js/site-info.js"></script>
  </body>
</html>
