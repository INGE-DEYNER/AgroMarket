# docker-compose.yml
# Solo bases de datos. El backend se levanta aparte con `mvn spring-boot:run`.
# Sin volúmenes: los contenedores nacen limpios cada vez que haces `docker compose up`.
services:
  mysql:
    image: mysql:8
    container_name: agromarket-mysql
    environment:
      MYSQL_DATABASE: agromarket
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: agromarket-mongo
    ports:
      - "27017:27017"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval "db.adminCommand(''ping'').ok" | grep 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
