# docker-compose.yml
# Levanta MySQL y MongoDB solamente (el backend se levanta por separado).
# IMPORTANTE: copia .env.example a .env y reemplaza con credenciales reales.

services:
  mysql:
    image: mysql:8
    container_name: agromarket-mysql
    environment:
      MYSQL_DATABASE: agromarket
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3308:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: agromarket-mongo
    ports:
      - "27018:27017"
    restart: unless-stopped
