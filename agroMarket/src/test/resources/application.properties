# CONFIGURACIÓN DE BASE DE DATOS (H2 en memoria para pruebas locales)
spring.datasource.url=jdbc:h2:mem:agromarket_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# SOLUCIÓN AL ERROR: Cambiado de 'validate' a 'update' para que cree la columna email_verificado automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never

# CONFIGURACIÓN DE PUERTO PARA RENDER (Evita fallos por puerto bloqueado)
server.port=${SERVER_PORT:8080}

# SEGURIDAD Y JWT
jwt.secret=test-secret-key-change-in-test-min-256-bits-12345678901234567890-test-secret-key-change-in-test
agromarket.jwt.expiration-ms=86400000
app.security.id-encryption-secret=testSecretKeyForIdEncryption32Bytes

# CORS Y URLS (Render sobreescribirá esto si usas variables de entorno)
app.frontend-url=http://localhost:5173
app.cors-allowed-origins=http://localhost:5173,http://localhost:3000
spring.flyway.enabled=false

# CONFIGURACIONES MOCK (OAuth2 y Brevo)
spring.security.oauth2.client.registration.google.client-id=mock-client-id
spring.security.oauth2.client.registration.google.client-secret=mock-client-secret
brevo.api.key=mock-brevo-key
brevo.sender.email=test@agro-market.app
brevo.sender.name=AgroMarket Test

