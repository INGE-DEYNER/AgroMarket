spring.datasource.url=jdbc:h2:mem:agromarket_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never
agromarket.jwt.secret=test-secret-key-change-in-test-min-256-bits-12345678901234567890
agromarket.jwt.expiration-ms=86400000
