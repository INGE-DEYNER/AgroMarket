# spring.profiles.active=twilio
# spring.profiles.active=pse
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Exclude Flyway auto-configuration by default; enable via SPRING_FLYWAY_ENABLED env var if needed
spring.autoconfigure.exclude=${SPRING_AUTOCONFIG_EXCLUDE:org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration}

# DataSource — Coolify MySQL con fallbacks
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://s958umwniixjx7lys2c7uhdi:3306/default?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mysql}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dirusPj4TYuMbSDPagfW3EtOhpT1JtiwAgYGyycfXC12w4DjwS5HKE2vb0PpJYEa}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP — ajustado para Aiven free tier
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.format_sql=false

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:changeme}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:changeme}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt.secret=${JWT_SECRET:8f3e9b2a-5d4c-4a1f-9d2b-7c6e2a1f9b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2}
agromarket.jwt.expiration-ms=86400000

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

brevo.api.key=${BREVO_API_KEY:mock-key}
brevo.sender.email=${BREVO_SENDER_EMAIL:test@agro-market.app}
brevo.sender.name=${BREVO_SENDER_NAME:AgroMarket}

app.uploads-path=${UPLOADS_PATH:uploads}

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# Inicio lazy - no inicializa beans hasta que se necesiten
spring.main.lazy-initialization=true

# Reduce tiempo de inicio de JPA
spring.jpa.open-in-view=false

# Deshabilita banner innecesario
spring.main.banner-mode=off

twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.verify.service-sid=${TWILIO_VERIFY_SERVICE_SID:}

anthropic.api-key=${ANTHROPIC_API_KEY:}

# Paginación por defecto
spring.data.web.pageable.default-page-size=12
spring.data.web.pageable.max-page-size=50
