# === BASE — AgroMarket ===
server.port=${SERVER_PORT:18080}
server.address=0.0.0.0
server.forward-headers-strategy=framework
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.main.banner-mode=off

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.format_sql=false

# MongoDB — auditoría de autenticación y sesiones
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27018/agromarket_auth}
spring.data.mongodb.database=${MONGO_DATABASE:agromarket_auth}
spring.data.mongodb.auto-index-creation=true

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:changeme}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:changeme}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

# JWT — secret leído desde env var JWT_SECRET (Spring relaxed binding: JWT_SECRET → jwt.secret)
# CRÍTICO: JWT_SECRET debe tener mínimo 64 caracteres. Sin valor por defecto — falla en startup si no está definida.
app.jwt.secret=${JWT_SECRET}
# Expiración: AgroMarketJwtProperties lee agromarket.jwt.expiration-ms (86400000 ms = 24 horas)
agromarket.jwt.expiration-ms=86400000
# CRÍTICO: ID_ENCRYPTION_KEY requerida para AES-256. Sin valor por defecto.
app.security.id-encryption-secret=${ID_ENCRYPTION_KEY}

# Frontend / CORS
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5174}
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174}

# Brevo email
brevo.api.key=${BREVO_API_KEY:mock-key}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME:AgroMarket}

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# Flyway deshabilitado por defecto
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Gemini — configura GEMINI_API_KEY en tu .env local o en el entorno de despliegue
gemini.api-key=${GEMINI_API_KEY:}

# Uploads
app.uploads-path=${UPLOADS_PATH:uploads}

# Paginación
spring.data.web.pageable.default-page-size=12
spring.data.web.pageable.max-page-size=50

# Logging
logging.level.root=WARN
logging.level.com.agromarket=INFO

# Lazy init — false por defecto para producción
spring.main.lazy-initialization=false
spring.main.banner-mode=off
