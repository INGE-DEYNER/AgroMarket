server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Exclude Flyway auto-configuration by default; enable via SPRING_FLYWAY_ENABLED env var if needed
spring.autoconfigure.exclude=${SPRING_AUTOCONFIG_EXCLUDE:org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3310/agromarket_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:agromarket_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:agromarket_pass}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.leak-detection-threshold=60000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:changeme}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:changeme}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=https://agromarket-vj8x.onrender.com/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

app.frontend-url=${APP_FRONTEND_URL:http://agromarket.dev:8090}
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://agromarket.dev,http://localhost:8090}

jwt.secret=${JWT_SECRET:8f3e9b2a-5d4c-4a1f-9d2b-7c6e2a1f9b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2}
agromarket.jwt.expiration-ms=86400000

spring.flyway.repair-on-migrate=true
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL:noreply@agromarket.co}
brevo.sender.name=${BREVO_SENDER_NAME:AgroMarket}

app.uploads-path=${UPLOADS_PATH:uploads}

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# Inicio lazy - no inicializa beans hasta que se necesiten
spring.main.lazy-initialization=true

# Reduce tiempo de inicio de JPA
spring.jpa.open-in-view=false

# Deshabilita banner innecesario
spring.main.banner-mode=off