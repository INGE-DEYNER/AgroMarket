spring.datasource.url=jdbc:mysql://localhost:33060/agromarket_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME:agromarket_user}
spring.datasource.password=${DB_PASSWORD:agromarket_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MongoDB local para auditoría de autenticación y sesiones
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27018/agromarket_auth}
spring.data.mongodb.database=${MONGO_DATABASE:agromarket_auth}
spring.data.mongodb.auto-index-creation=true
