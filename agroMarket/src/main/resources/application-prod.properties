# === PERFIL PRODUCCIÓN — AgroMarket ===
# Solo sobreescribe lo que difiere del base

# Google OAuth2 — usa variables de Railway, NO hardcodear aquí
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Frontend / CORS producción
app.frontend-url=${APP_FRONTEND_URL:https://www.agro-market.app}
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:https://agro-market.app,https://www.agro-market.app}

# Logs en prod: WARN general, INFO para el paquete propio (necesario para debug de auth flows)
logging.level.root=WARN
logging.level.com.agromarket=INFO