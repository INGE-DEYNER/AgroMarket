# === PERFIL PRODUCCIÓN — AgroMarket ===

# Puerto
server.port=${SERVER_PORT:8080}

# DataSource — Aiven MySQL con SSL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP para Aiven free tier
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH2_REDIRECT_URI:https://agromarket-vj8x.onrender.com/login/oauth2/code/google}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# Frontend URL
app.frontend-url=${APP_FRONTEND_URL:https://agro-mercado.app}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://agro-mercado.app}

# Brevo email
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL:ad24ff001@smtp-brevo.com}
brevo.sender.name=${BREVO_SENDER_NAME:AgroMarket}

# Logging
logging.level.root=WARN
logging.level.com.agromarket=INFO
