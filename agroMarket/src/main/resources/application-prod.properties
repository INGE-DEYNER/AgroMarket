# === PERFIL PRODUCCIÓN — AgroMarket ===
# Solo sobreescribe lo que difiere del base

# Google OAuth2 — usa variables del entorno de despliegue, NO hardcodear aquí
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Frontend / CORS producción
app.frontend-url=${APP_FRONTEND_URL:https://www.agro-market.app}
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:https://agro-market.app,https://www.agro-market.app}

# Logs en prod: WARN general, INFO para el paquete propio (necesario para debug de auth flows)
logging.level.root=WARN
logging.level.com.agromarket=INFO

# Hibernate Batching & DB Optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# HikariCP Optimizado
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Paginación Máxima
spring.data.web.pageable.max-page-size=50
