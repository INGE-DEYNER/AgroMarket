server.port=8080
server.servlet.context-path=/

app.frontend-url=https://agro-market.app
app.cors-allowed-origins=https://agro-market.app

# Datasource (require env vars in prod)
spring.datasource.url=${JDBC_DATABASE_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# In production rely on migrations instead of Hibernate auto-ddl
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway: baseline if migrating an existing DB, enable migrations in prod
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.security.oauth2.client.registration.google.redirect-uri=https://agromarket-vj8x.onrender.com/login/oauth2/code/google

# Actuator and probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true

# Require explicit JWT secret in production
jwt.secret=${JWT_SECRET}
agromarket.jwt.expiration-ms=86400000

# Monitoring / docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Brevo REST API email configuration
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=noreply@agromarket.com
brevo.sender.name=AgroMarket

