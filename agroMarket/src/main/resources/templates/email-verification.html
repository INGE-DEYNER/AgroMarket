<!doctype html>
<html>
  <body style="font-family: Arial, sans-serif; color: #333">
    <div
      style="
        max-width: 600px;
        margin: 0 auto;
        padding: 24px;
        border-radius: 8px;
        background: #f7fff8;
      "
    >
      <h2 style="color: #2d6a4f">Verificación de correo</h2>
      <p>
        Usa el siguiente enlace para verificar tu cuenta. Expira en 15 minutos.
      </p>
      <p style="text-align: center">
        <a
          href="${verifyUrl}"
          style="
            display: inline-block;
            padding: 12px 20px;
            background: #2d6a4f;
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
          "
          >Verificar correo</a
        >
      </p>
      <p style="font-size: 12px; color: #666">
        Si no solicitaste esto, ignora este correo.
      </p>
    </div>
  </body>
</html>
