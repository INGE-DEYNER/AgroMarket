name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate CHANGELOG with git-cliff
        id: gitcliff
        uses: orhun/git-cliff-action@v2
        with:
          config: ./cliff.toml
          args: --latest --strip header

      - name: Upload CHANGELOG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHANGELOG
          path: CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.gitcliff.outputs.content }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (versioned)
        run: |
          cd agroMarket
          IMAGE=ghcr.io/${{ github.repository_owner }}/agromarket:${{ github.ref_name }}
          docker build -t $IMAGE .
          docker tag $IMAGE ghcr.io/${{ github.repository_owner }}/agromarket:latest
          docker push $IMAGE
          docker push ghcr.io/${{ github.repository_owner }}/agromarket:latest

      - name: Deploy to Kubernetes (update image)
        if: ${{ secrets.KUBECONFIG != '' }}
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          echo "$KUBECONFIG_DATA" | base64 --decode > $HOME/.kube/config
          kubectl -n default set image deployment/agromarket agromarket=ghcr.io/${{ github.repository_owner }}/agromarket:${{ github.ref_name }} || true
