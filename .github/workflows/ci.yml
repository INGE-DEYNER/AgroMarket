name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Permiso minimo: este workflow solo lee el codigo. Sin esto, una action
# comprometida podria publicar releases o cambiar configuracion.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 15
    steps:
      # Acciones fijadas por SHA, no por etiqueta.
      #
      # "actions/checkout@v4" es una etiqueta movil: quien controle esa
      # etiqueta puede ejecutar codigo arbitrario en este repositorio con los
      # permisos del job. El SHA identifica una version exacta e inmutable.
      # Para actualizar: releases de la accion, copiar el SHA del commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Build and test
        run: |
          cd agroMarket
          mvn -B -DskipTests=false test
          # "clean" es obligatorio: sin el, una compilacion incremental puede
          # dar verde sin recompilar y dejar un jar viejo en la imagen.
          mvn -B clean package -DskipTests
      - name: Build Docker image
        if: success()
        run: |
          cd agroMarket
          docker build -t agromarket:ci .
      - name: Scan image with Trivy
        if: success()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: agromarket:ci
          format: "table"
          severity: "CRITICAL,HIGH"
          # exit-code: 0 hacia que la exploracion no rompia NADA: se ejecutaba,
          # moria el informe y la build pasaba igual. Un escaner que no puede
          # parar la build es un informe, no un control.
          # Con exit-code: 1, una vulnerabilidad CRITICAL o HIGH la para.
          exit-code: "1"
          # ignore-unfixed deja pasar los avisos sin parche disponible, que no
          # son accionables y no deberían bloquear el trabajo de todo el equipo.
          ignore-unfixed: true