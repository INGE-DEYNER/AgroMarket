name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Build and test
        run: |
          cd agroMarket
          chmod +x mvnw
          ./mvnw -B -DskipTests=false test
          ./mvnw -B package -DskipTests
      - name: Build Docker image
        if: success()
        run: |
          cd agroMarket
          docker build -t agromarket:ci .
      - name: Scan image with Trivy
        if: success()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agromarket:ci
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image to GHCR
        run: |
          cd agroMarket
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$OWNER/agromarket:latest
          docker build -t $IMAGE .
          docker push $IMAGE

  integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    needs: publish
    if: github.ref == 'refs/heads/main'
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      DOCKER_HOST: unix:///var/run/docker.sock
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: agromarket_db
          MYSQL_USER: agromarket_user
          MYSQL_PASSWORD: agromarket_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd='mysqladmin ping -uroot -prootpass --silent' --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do if mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent; then echo ok; break; fi; sleep 2; done
      - name: Run integration tests (mvn failsafe)
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/agromarket_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME: agromarket_user
          DB_PASSWORD: agromarket_pass
        run: |
          cd agroMarket
          ./mvnw -B -Dflyway.url=${DB_URL} -Dflyway.user=${DB_USERNAME} -Dflyway.password=${DB_PASSWORD} -Pintegration-tests verify || (
            echo "MySQL integration failed — retrying with H2"
            ./mvnw -B -Pintegration-tests verify -Dspring.profiles.active=integration-tests
          )

  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    needs: integration-tests
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "1.27.0"
      - name: Configure KUBECONFIG
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          echo "$KUBECONFIG_DATA" | base64 --decode > $HOME/.kube/config
      - name: Install kustomize and kubeval
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/latest/download/kustomize_kustomize.tar.gz | tar xz
          chmod +x kustomize
          mv kustomize /usr/local/bin/kustomize || true
          curl -sL https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz | tar xz
          chmod +x kubeval
          mv kubeval /usr/local/bin/kubeval || true
      - name: Validate Kubernetes manifests
        run: |
          kustomize build k8s | kubeval --strict --kubernetes-version '1.27.0'
      - name: Deploy with kustomize
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$OWNER/agromarket:latest
          kubectl apply -k k8s/
          kubectl -n default set image deployment/agromarket agromarket=$IMAGE || true
