name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Build and test
        run: |
          cd agroMarket
          mvn -B -DskipTests=false test
          mvn -B package -DskipTests
      - name: Build Docker image
        if: success()
        run: |
          cd agroMarket
          docker build -t agromarket:ci .
      - name: Scan image with Trivy
        if: success()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agromarket:ci
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
